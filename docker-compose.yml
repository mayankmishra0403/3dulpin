services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: ulpin3d-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadastre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadastre}
      POSTGRES_DB: ${POSTGRES_DB:-ulpin3d}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadastre} -d ${POSTGRES_DB:-ulpin3d}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ulpin3d-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cadastre}:${POSTGRES_PASSWORD:-cadastre}@postgis:5432/${POSTGRES_DB:-ulpin3d}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ulpin3d-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      - backend

volumes:
  pgdata: